<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spino Ghost Racing — moderation</title>
<!--
  THE MODERATION DESK. One static page, no build, no server of its own: it talks
  to the same Supabase project the game does, as a signed-in moderator (a
  players row with moderator = true), through the security-definer RPCs in
  supabase_schema.sql — open_reports, mod_tracks, mod_cups, mod_players,
  mod_log, hide_track, review_cup, remove_time, ban_player, unban_player,
  resolve_reports. Every action is logged in mod_actions by the database.

  Host it anywhere static (GitHub Pages, a bucket) or open the file locally.
  First visit asks for the project URL and anon key; they stay in localStorage.
-->
<style>
  :root { color-scheme: dark; --bg:#0f1015; --card:#0e0e14; --ink:#fff; --muted:#9ca3af;
          --edge:rgba(255,255,255,.1); --red:#ef4444; --gold:#eab308; --green:#22c55e; }
  * { box-sizing: border-box; }
  /* NOTHING SHOWS BEFORE A MODERATOR IS SIGNED IN — not the tabs, not the
     header. `hidden` must beat the display:flex rules below. */
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--edge); }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; text-transform:uppercase; }
  header .who { color:var(--muted); margin-left:auto; }
  nav { display:flex; gap:6px; padding:12px 20px 0; flex-wrap:wrap; }
  nav button { background:#18181b; color:var(--muted); border:1px solid var(--edge); border-radius:10px; padding:8px 14px; cursor:pointer; font-weight:600; }
  nav button.on { background:#fff; color:#000; }
  main { padding:16px 20px 40px; }
  .card { background:var(--card); border:1px solid var(--edge); border-radius:14px; padding:14px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--edge); vertical-align:top; }
  th { color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
  td.num { font-variant-numeric: tabular-nums; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.04em; }
  .pill.red { background:rgba(239,68,68,.18); color:#fca5a5; }
  .pill.gold { background:rgba(234,179,8,.18); color:#fde68a; }
  .pill.green { background:rgba(34,197,94,.18); color:#86efac; }
  .pill.grey { background:rgba(255,255,255,.08); color:var(--muted); }
  .act { display:flex; gap:6px; flex-wrap:wrap; }
  .act button, form button, .row button { background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12px; font-weight:600; }
  .act button.danger { border-color:var(--red); color:#fca5a5; }
  .act button.primary, form button.primary { background:var(--red); border-color:var(--red); }
  input, select { background:#000; color:var(--ink); border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:8px 10px; font:inherit; }
  form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#000; border:1px solid var(--edge); border-radius:999px; padding:8px 16px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }
  .empty { color:var(--muted); padding:20px; text-align:center; }
  .pager { display:flex; align-items:center; gap:10px; padding:10px 0 2px; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
  .pager button { background:#18181b; color:var(--ink); border:1px solid var(--edge); border-radius:8px; padding:5px 12px; cursor:pointer; font-weight:600; }
  .pager button[disabled] { opacity:.35; cursor:default; }
  .pager .n { margin-left:auto; }
  @media (max-width: 720px) { th:nth-child(n+4), td:nth-child(n+4):not(:last-child) { display:none; } }
  /* ---- feed (WYSIWYG) ---- */
  .subtabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .subtabs button { background:#18181b; color:var(--muted); border:1px solid var(--edge); border-radius:999px; padding:6px 14px; cursor:pointer; font-weight:700; font-size:12px; letter-spacing:.04em; }
  .subtabs button.on { background:var(--red); color:#0f1015; border-color:var(--red); }
  .subtabs .sort { margin-left:auto; display:flex; gap:6px; }
  .subtabs .sort button.on { background:#fff; color:#000; border-color:#fff; }
  .feedgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .fcard { background:var(--card); border:1px solid var(--edge); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .fcard .map { width:100%; aspect-ratio:1/1; display:block; background:#141821; border-bottom:1px solid var(--edge); }
  .fcard .cup { width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; background:linear-gradient(160deg,#1a1206,#0e0e14); border-bottom:1px solid var(--edge); }
  .fcard .cup .n { font-size:34px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; }
  .fcard .cup .l { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .fcard .body { padding:11px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .fcard .nm { font-weight:700; font-size:15px; line-height:1.15; display:flex; align-items:center; gap:6px; }
  .fcard .by { color:var(--muted); font-size:12px; }
  .fcard .meta { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; display:flex; gap:12px; flex-wrap:wrap; }
  .fcard .foot { margin-top:auto; display:flex; align-items:center; gap:8px; padding-top:4px; }
  .fcard .foot .thumbs { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; display:flex; gap:9px; }
  .fcard .foot button { margin-left:auto; background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:6px 11px; cursor:pointer; font-size:12px; font-weight:600; }
  .fcard .foot button.pinned { background:var(--gold); color:#0f1015; border-color:var(--gold); }
  .fcard.ispinned { border-color:var(--gold); }
.stages{display:flex;flex-wrap:wrap;gap:14px;padding:8px 0}.stage{width:160px}.stage canvas{width:160px;height:110px;display:block;background:#0f1015;border-radius:10px;margin-bottom:6px}.small{font-size:12px}button.ghost{padding:2px 8px;font-size:12px;margin-left:6px}
.teams{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.team{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#cfd2dc}
.team svg{width:22px;height:22px;background:#0e0e14;border-radius:3px}
.team .dot{display:inline-block;width:12px;height:12px;border-radius:50%}
</style>
</head>
<body>
<header id="head" hidden>
  <h1>Spino Ghost Racing · Moderation</h1>
  <span class="who" id="who"></span>
  <button id="signout" hidden>Sign out</button>
</header>
<nav id="nav" hidden>
  <button data-tab="feed">Feed</button>
  <button data-tab="reports" class="on">Reports <span id="n-reports"></span></button>
  <button data-tab="cups">Cups</button>
  <button data-tab="tracks">Tracks</button>
  <button data-tab="players">Players</button>
  <button data-tab="log">Log</button>
</nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<!-- Optional: a sibling config.js that sets window.SGR_PROJECT = {url, key}
     (the project's URL and anon key) so a hosted desk skips the Connect step.
     The anon key is the public client key the game ships with; the desk's
     power comes from the moderator sign-in, not the key. -->
<script src="config.js"></script>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const main = $('#main');
  let sb = null, me = null, tab = 'reports';

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const when = (t) => t ? new Date(t).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
  const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); };

  // ---------------------------------------------------------- configuration
  function config() {
    const baked = window.SGR_PROJECT || {};
    return { url: localStorage.getItem('sgr.url') || baked.url || '',
             key: localStorage.getItem('sgr.anon') || baked.key || '' };
  }
  function askConfig() {
    const c = config();
    main.innerHTML = `
      <div class="card">
        <h2>Connect</h2>
        <p class="muted">The project URL and anon key from Supabase › Project settings › API. Kept in this browser only.</p>
        <form id="cfg">
          <input name="url" placeholder="https://xxxx.supabase.co" value="${esc(c.url)}" size="40" required>
          <input name="key" placeholder="anon key" value="${esc(c.key)}" size="40" required>
          <button class="primary">Save</button>
        </form>
      </div>`;
    $('#cfg').onsubmit = (e) => {
      e.preventDefault();
      localStorage.setItem('sgr.url', e.target.url.value.trim());
      localStorage.setItem('sgr.anon', e.target.key.value.trim());
      boot();
    };
  }

  // ------------------------------------------------------------------ auth
  function askLogin(note = '') {
    main.innerHTML = `
      <div class="card">
        <h2>Sign in</h2>
        <p class="muted">${esc(note)}</p>
        <form id="login">
          <input name="email" type="email" placeholder="email" required>
          <input name="password" type="password" placeholder="password" required>
          <button class="primary">Sign in</button>
          <button type="button" id="recfg">Change project</button>
        </form>
      </div>`;
    $('#login').onsubmit = async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: e.target.email.value, password: e.target.password.value });
      if (error) return toast(error.message);
      boot();
    };
    $('#recfg').onclick = () => { localStorage.removeItem('sgr.url'); askConfig(); };
  }

  async function boot() {
    const c = config();
    if (!c.url || !c.key) return askConfig();
    sb = window.supabase.createClient(c.url, c.key);
    const { data } = await sb.auth.getUser();
    if (!data?.user) return askLogin();
    const row = await sb.from('players').select('username, moderator').eq('id', data.user.id).maybeSingle();
    if (!row.data?.moderator) {
      await sb.auth.signOut();
      return askLogin('That account is not a moderator.');
    }
    me = { id: data.user.id, username: row.data.username };
    $('#who').textContent = `u/${me.username}`;
    $('#signout').hidden = false;
    $('#head').hidden = false;
    $('#nav').hidden = false;
    show(tab);
  }
  $('#signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $('#nav').onclick = (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.tab); };

  // ------------------------------------------------------------------ rpc
  async function rpc(fn, args = {}) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) { toast(error.message); throw error; }
    return data;
  }
  async function act(fn, args, done) {
    try { await rpc(fn, args); toast(done); show(tab); } catch (_) {}
  }
  const reason = (what) => prompt(`Reason (shown in the log${what ? ' and to the author' : ''}):`, '') ?? null;

  // ---------------------------------------------------------------- views
  // EVERY LIST IS PAGED. Forty rows or two dozen cards at a time, Prev / Next,
  // the page kept across an action on the same tab and reset on a switch.
  const PAGE = 40, CARDS = 24;
  const pages = {};
  function pageOf(key) { return pages[key] || 0; }
  function pagerBar(key, total, size) {
    const n = Math.max(1, Math.ceil(total / size));
    const at = Math.min(pageOf(key), n - 1); pages[key] = at;
    const from = total ? at * size + 1 : 0, to = Math.min(total, (at + 1) * size);
    return `<div class="pager" data-pager="${esc(key)}">
      <button data-page="prev" ${at <= 0 ? 'disabled' : ''}>‹ Prev</button>
      <button data-page="next" ${at >= n - 1 ? 'disabled' : ''}>Next ›</button>
      <span class="n">${from}–${to} of ${total}${n > 1 ? ` · page ${at + 1} of ${n}` : ''}</span>
    </div>`;
  }
  // A pager click is handled before any tab's own handler and never leaves
  // the page: the list re-renders from what it already holds.
  main.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-page]'); if (!b || b.disabled) return;
    const bar = b.closest('[data-pager]'); const key = bar.dataset.pager;
    pages[key] = pageOf(key) + (b.dataset.page === 'next' ? 1 : -1);
    e.stopPropagation();
    const re = rerender[key]; if (re) re();
  }, true);
  const rerender = {};

  async function show(which) {
    if (which !== tab) pages[which] = 0;
    tab = which;
    for (const b of $('#nav').querySelectorAll('button')) b.classList.toggle('on', b.dataset.tab === which);
    main.innerHTML = '<div class="empty">Loading…</div>';
    try {
      await ({ feed, reports, cups, tracks, players, log })[which]();
    } catch (e) {
      main.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  }

  function table(head, rows, empty, key) {
    if (!rows.length) return `<div class="empty">${esc(empty)}</div>`;
    key = key || tab;
    const page = () => {
      const at = pageOf(key);
      const slice = rows.slice(at * PAGE, (at + 1) * PAGE);
      return `<table><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${slice.join('')}</tbody></table>${pagerBar(key, rows.length, PAGE)}`;
    };
    rerender[key] = () => {
      const wrap = main.querySelector(`[data-pagewrap="${key}"]`); if (wrap) wrap.innerHTML = page();
    };
    return `<div data-pagewrap="${esc(key)}">${page()}</div>`;
  }

  async function reports() {
    const rows = await rpc('open_reports', { p_limit: 1000 });
    $('#n-reports').textContent = rows.length ? `(${rows.length})` : '';
    main.innerHTML = `<div class="card">
      <p class="muted">Everything players flagged and nobody has looked at. Three distinct reports already hid the piece; act, then resolve to clear the queue.</p>
      ${table(['What', 'By', 'Reports', 'Reasons', 'Last', ''], rows.map((r) => `
        <tr>
          <td><span class="pill ${r.kind === 'cup' ? 'gold' : 'grey'}">${esc(r.kind)}</span> <b>${esc(r.title)}</b><br><span class="muted">${esc(r.target)}</span></td>
          <td>${esc(r.author || '—')}</td>
          <td class="num">${r.reports}</td>
          <td>${esc(r.reasons)}</td>
          <td class="muted">${when(r.last_at)}</td>
          <td class="act">
            ${r.kind === 'track'
              ? `<button class="danger" data-a="hide" data-t="${esc(r.target)}">Hide</button>
                 <button data-a="unhide" data-t="${esc(r.target)}">Restore</button>`
              : `<button class="danger" data-a="reject" data-t="${esc(r.target)}">Reject</button>
                 <button data-a="approve" data-t="${esc(r.target)}">Restore</button>`}
            <button data-a="resolve" data-k="${esc(r.kind)}" data-t="${esc(r.target)}">Resolve</button>
          </td>
        </tr>`), 'No open reports.')}
    </div>`;
    main.onclick = (e) => {
      const b = e.target.closest('button[data-a]'); if (!b) return;
      const t = b.dataset.t;
      switch (b.dataset.a) {
        case 'hide': { const why = reason(); if (why !== null) act('hide_track', { p_track: t, p_hidden: true, p_reason: why }, 'Track hidden'); break; }
        case 'unhide': act('hide_track', { p_track: t, p_hidden: false, p_reason: 'restored' }, 'Track restored'); break;
        case 'reject': { const why = reason(true); if (why !== null) act('review_cup', { p_cup: t, p_approve: false, p_reason: why }, 'Cup rejected'); break; }
        case 'approve': act('review_cup', { p_cup: t, p_approve: true, p_reason: '' }, 'Cup live'); break;
        case 'resolve': act('resolve_reports', { p_kind: b.dataset.k, p_target: t }, 'Resolved'); break;
      }
    };
  }

  // The cups view keeps its rows so a stage preview can be opened without
  // another round trip.
  let cupRows = [];
  async function cups() {
    const rows = await rpc('mod_cups', { p_limit: 1000 });
    pinField = 'pinned';
    rows.sort(feedBefore);
    cupRows = rows;
    main.innerHTML = `<div class="card">
      <p class="muted">Every championship, in the order the game's CHAMPS feed shows them: pinned first, then newest first.<br>Pending ones came from a direct insert or were pulled for review; open the stages to see what a cup is made of, approve to show, reject to take down. Hide takes a live cup off the feed without touching its results; a completed cup leaves the feed by itself a day after it ends.</p>
      ${table(['Cup', 'By', 'Stages', 'Status', 'Feed', 'Likes', 'Reports', 'Ends', ''], rows.map((c) => {
        const over = Number(c.ends_ms) > 0 && Number(c.ends_ms) < Date.now();
        return `
        <tr data-cup="${esc(c.id)}">
          <td><b>${esc(c.name)}</b>${pinPills(c, 'Champs')}<br><span class="muted">${esc(c.id)}</span>${teamRow(c.teams)}</td>
          <td>${esc(c.author || '—')}</td>
          <td class="num">${c.stages} <button class="ghost" data-a="stages" data-t="${esc(c.id)}">Show</button></td>
          <td><span class="pill ${c.status === 'approved' ? 'green' : c.status === 'pending' ? 'gold' : 'red'}">${esc(c.status)}</span>${c.rejection ? `<br><span class="muted">${esc(c.rejection)}</span>` : ''}</td>
          <td><span class="pill ${c.hidden ? 'red' : over ? 'gold' : 'green'}">${c.hidden ? 'hidden' : over ? 'over' : 'showing'}</span></td>
          <td class="num">▲ ${c.ups ?? 0} ▼ ${c.downs ?? 0}</td>
          <td class="num">${c.reports}</td>
          <td class="muted">${c.ends_ms ? when(new Date(Number(c.ends_ms)).toISOString()) : '—'}</td>
          <td class="act">
            ${c.status !== 'approved' ? `<button data-a="approve" data-t="${esc(c.id)}">Approve</button>` : ''}
            ${c.status !== 'rejected' ? `<button class="danger" data-a="reject" data-t="${esc(c.id)}">Reject</button>` : ''}
            ${c.pinned ? `<button data-a="unpin" data-w="tab" data-t="${esc(c.id)}">Unpin from Champs</button>`
                       : `<button data-a="pin" data-w="tab" data-t="${esc(c.id)}">Pin on Champs</button>`}
            ${c.pinned_home ? `<button data-a="unpin" data-w="home" data-t="${esc(c.id)}">Unpin from Home</button>`
                            : `<button data-a="pin" data-w="home" data-t="${esc(c.id)}">Pin on Home</button>`}
            ${c.hidden ? `<button data-a="unhide" data-t="${esc(c.id)}">Show</button>`
                       : `<button class="danger" data-a="hide" data-t="${esc(c.id)}">Hide</button>`}
          </td>
        </tr>`; }), 'No cups yet.')}
    </div>`;
    main.onclick = (e) => {
      const so = e.target.closest('button[data-sort]');
      if (so) { feedSort = so.dataset.sort; return cups(); }
      const b = e.target.closest('button[data-a]'); if (!b) return;
      const t = b.dataset.t;
      if (b.dataset.a === 'stages') { toggleStages(t); return; }
      if (b.dataset.a === 'approve') act('review_cup', { p_cup: t, p_approve: true, p_reason: '' }, 'Cup live');
      else if (b.dataset.a === 'reject') { const why = reason(true); if (why !== null) act('review_cup', { p_cup: t, p_approve: false, p_reason: why }, 'Cup rejected'); }
      else if (b.dataset.a === 'pin') act('pin_cup', { p_cup: t, p_pinned: true, p_reason: '', p_where: b.dataset.w || 'tab' }, 'Cup pinned');
      else if (b.dataset.a === 'unpin') act('pin_cup', { p_cup: t, p_pinned: false, p_reason: '', p_where: b.dataset.w || 'tab' }, 'Cup unpinned');
      else if (b.dataset.a === 'hide') { const why = reason(); if (why !== null) act('hide_cup', { p_cup: t, p_hidden: true, p_reason: why }, 'Cup hidden'); }
      else if (b.dataset.a === 'unhide') act('hide_cup', { p_cup: t, p_hidden: false, p_reason: 'shown' }, 'Cup showing');
    };
  }

  // THE STAGES OF A CUP, DRAWN. A reviewer could only see a stage COUNT and
  // had to approve blind (2026-09-20). Each stage is its track's minimap with
  // name, length and laps — a published track's row is public — or, for a
  // generated circuit, its seed. The row folds under the cup's row.
  async function toggleStages(id) {
    const tr = main.querySelector(`tr[data-cup="${CSS.escape(id)}"]`); if (!tr) return;
    const open = tr.nextElementSibling;
    if (open && open.classList.contains('stagerow')) { open.remove(); return; }
    const cup = cupRows.find((c) => c.id === id); if (!cup) return;
    const stages = Array.isArray(cup.stage_list) ? cup.stage_list : [];
    const row = document.createElement('tr'); row.className = 'stagerow';
    row.innerHTML = `<td colspan="9"><div class="stages">${stages.map((st, i) => `
      <div class="stage" data-key="${esc(st.key || '')}">
        <canvas></canvas>
        <div><b>${i + 1}.</b> ${esc(st.name || st.key || '')}</div>
        <div class="muted small">${esc(st.key || '')}</div>
      </div>`).join('') || '<span class="muted">No stages.</span>'}</div></td>`;
    tr.after(row);
    const keys = stages.map((st) => st.key).filter((k) => typeof k === 'string' && k.startsWith('pub:'));
    let byKey = {};
    if (keys.length) {
      const { data, error } = await sb.from('tracks').select('key,name,outline,laps,hidden').in('key', keys);
      if (error) toast(error.message);
      for (const t of data || []) byKey[t.key] = t;
    }
    for (const el of row.querySelectorAll('.stage')) {
      const key = el.dataset.key; const cv = el.querySelector('canvas'); const meta = el.querySelector('.small');
      if (key.startsWith('gen:')) { meta.textContent = `Circuit #${key.slice(4)} — generated`; drawMap(cv, null); continue; }
      const t = byKey[key];
      if (!t) { meta.textContent = 'not visible — hidden or gone'; drawMap(cv, null); continue; }
      drawMap(cv, t.outline);
      meta.textContent = `${kmOf(t.outline).toFixed(1)} km · ${t.laps} laps${t.hidden ? ' · HIDDEN' : ''}`;
    }
  }

  async function tracks() {
    const rows = await rpc('mod_tracks', { p_limit: 1000 });
    pinField = 'pinned';
    rows.sort(feedBefore);
    main.innerHTML = `<div class="card">
      <p class="muted">Published tracks in the order the game's TRACKS feed shows them: pinned first, then newest first.<br>Hidden ones leave the feed and every board but keep their data for an appeal.</p>
      ${table(['Track', 'By', 'State', 'Likes', 'Reports', 'Published', ''], rows.map((t) => `
        <tr>
          <td><b>${esc(t.name)}</b>${pinPills(t, 'Tracks')}<br><span class="muted">${esc(t.key)}</span></td>
          <td>${esc(t.author || '—')}</td>
          <td><span class="pill ${t.hidden ? 'red' : 'green'}">${t.hidden ? 'hidden' : 'showing'}</span></td>
          <td class="num">▲ ${t.ups ?? 0} ▼ ${t.downs ?? 0}</td>
          <td class="num">${t.reports}</td>
          <td class="muted">${when(t.created_at)}</td>
          <td class="act">
            ${t.pinned ? `<button data-a="unpin" data-w="tab" data-t="${esc(t.key)}">Unpin from Tracks</button>`
                       : `<button data-a="pin" data-w="tab" data-t="${esc(t.key)}">Pin on Tracks</button>`}
            ${t.pinned_home ? `<button data-a="unpin" data-w="home" data-t="${esc(t.key)}">Unpin from Home</button>`
                            : `<button data-a="pin" data-w="home" data-t="${esc(t.key)}">Pin on Home</button>`}
            ${t.hidden ? `<button data-a="unhide" data-t="${esc(t.key)}">Restore</button>`
                       : `<button class="danger" data-a="hide" data-t="${esc(t.key)}">Hide</button>`}
            <button data-a="time" data-t="${esc(t.key)}">Remove a time…</button>
          </td>
        </tr>`), 'No published tracks yet.')}
    </div>`;
    main.onclick = async (e) => {
      const so = e.target.closest('button[data-sort]');
      if (so) { feedSort = so.dataset.sort; return tracks(); }
      const b = e.target.closest('button[data-a]'); if (!b) return;
      const t = b.dataset.t;
      if (b.dataset.a === 'pin') act('pin_track', { p_track: t, p_pinned: true, p_reason: '', p_where: b.dataset.w || 'tab' }, 'Track pinned');
      else if (b.dataset.a === 'unpin') act('pin_track', { p_track: t, p_pinned: false, p_reason: '', p_where: b.dataset.w || 'tab' }, 'Track unpinned');
      else if (b.dataset.a === 'hide') { const why = reason(); if (why !== null) act('hide_track', { p_track: t, p_hidden: true, p_reason: why }, 'Track hidden'); }
      else if (b.dataset.a === 'unhide') act('hide_track', { p_track: t, p_hidden: false, p_reason: 'restored' }, 'Track restored');
      else if (b.dataset.a === 'time') {
        const who = prompt('Remove whose time? Username:', ''); if (!who) return;
        const p = await sb.from('players').select('id').ilike('username', who).maybeSingle();
        if (!p.data) return toast('No such player');
        const why = reason(); if (why === null) return;
        act('remove_time', { p_track: t, p_player: p.data.id, p_reason: why }, 'Time removed');
      }
    };
  }

  async function players(query = '') {
    const rows = await rpc('mod_players', { p_query: query, p_limit: 500 });
    main.innerHTML = `<div class="card">
      <form id="find"><input name="q" placeholder="username" value="${esc(query)}"><button>Find</button></form>
    </div>
    <div class="card">
      ${table(['Player', 'State', 'Joined', ''], rows.map((p) => `
        <tr>
          <td><b>${esc(p.username || '(no name)')}</b>${p.moderator ? ' <span class="pill gold">mod</span>' : ''}<br><span class="muted">${esc(p.id)}</span></td>
          <td>${p.banned ? '<span class="pill red">banned</span>' : p.suspended_until && new Date(p.suspended_until) > new Date() ? `<span class="pill gold">suspended until ${when(p.suspended_until)}</span>` : '<span class="pill green">ok</span>'}</td>
          <td class="muted">${when(p.created_at)}</td>
          <td class="act">
            ${p.banned || (p.suspended_until && new Date(p.suspended_until) > new Date())
              ? `<button data-a="unban" data-t="${esc(p.id)}">Lift</button>`
              : `<button data-a="suspend" data-t="${esc(p.id)}">Suspend 7 days</button>
                 <button class="danger" data-a="ban" data-t="${esc(p.id)}">Ban</button>`}
          </td>
        </tr>`), 'Nobody matches.')}
    </div>`;
    $('#find').onsubmit = (e) => { e.preventDefault(); players(e.target.q.value.trim()); };
    main.onclick = (e) => {
      const b = e.target.closest('button[data-a]'); if (!b) return;
      const t = b.dataset.t;
      if (b.dataset.a === 'unban') act('unban_player', { p_player: t }, 'Lifted');
      else if (b.dataset.a === 'suspend') { const why = reason(); if (why !== null) act('ban_player', { p_player: t, p_until: new Date(Date.now() + 7 * 864e5).toISOString(), p_reason: why }, 'Suspended'); }
      else if (b.dataset.a === 'ban') { const why = reason(); if (why !== null && confirm('Ban permanently?')) act('ban_player', { p_player: t, p_until: null, p_reason: why }, 'Banned'); }
    };
  }

  async function log() {
    const rows = await rpc('mod_log', { p_limit: 1000 });
    main.innerHTML = `<div class="card">
      ${table(['When', 'Action', 'Target', 'Reason', 'Moderator'], rows.map((a) => `
        <tr>
          <td class="muted">${when(a.created_at)}</td>
          <td><span class="pill grey">${esc(a.action)}</span></td>
          <td>${esc(a.target)}</td>
          <td>${esc(a.reason || '')}</td>
          <td class="muted">${esc(a.moderator)}</td>
        </tr>`), 'Nothing yet.')}
    </div>`;
  }

  // -------------------------------------------------------- feed (WYSIWYG)
  // What players see, minus the animation: the same daily(), feed() and cups()
  // RPCs the game reads, drawn as cards with a static minimap, each with a pin.
  // ONE ORDER (2026-09-22): the game lost its TOP/NEW chip; every list runs
  // pinned first, then newest, and so does the desk.
  let feedSub = 'home', feedSort = 'new';

  // THE ORDER THE PHONES USE, one rule for every list here (2026-09-21):
  // pinned first whatever the chip says; NEW is newest first by timestamp,
  // TOP is most liked first, the newer one breaking a tie. The Tracks and
  // Cups tables run by it too, so the desk is a 1:1 reflection of the game.
  const postedAt = (x) => Date.parse(x.created_at || 0) || 0;
  // A PIN IS PER TAB (2026-09-21): `pinned` is the TRACKS / CHAMPS tab's
  // pin, `pinned_home` is HOME's. The list being drawn says which one it
  // orders by, and its buttons set that one.
  let pinField = 'pinned';
  function feedBefore(a, b) {
    if (!!a[pinField] !== !!b[pinField]) return a[pinField] ? -1 : 1;
    if (feedSort === 'top' && (a.ups ?? 0) !== (b.ups ?? 0)) return (b.ups ?? 0) - (a.ups ?? 0);
    return postedAt(b) - postedAt(a);
  }
  function sortChips() { return ''; }   // no chip: one order, the game's
  const PER_METRE = 9.3;

  function drawMap(cv, outline) {
    const ctx = cv.getContext('2d'); const W = cv.width = cv.clientWidth * 2, H = cv.height = cv.clientHeight * 2;
    ctx.clearRect(0, 0, W, H);
    if (!outline || outline.length < 6) return;
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (let i = 0; i < outline.length; i += 2) { const x = outline[i], y = outline[i + 1];
      if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y; }
    const pad = W * 0.14, sw = maxx - minx || 1, sh = maxy - miny || 1;
    const sc = Math.min((W - pad * 2) / sw, (H - pad * 2) / sh);
    const ox = (W - sw * sc) / 2, oy = (H - sh * sc) / 2;
    const px = (i) => ox + (outline[i] - minx) * sc, py = (i) => oy + (outline[i] - miny) * sc;
    ctx.beginPath(); ctx.moveTo(px(0), py(1));
    for (let i = 2; i < outline.length; i += 2) ctx.lineTo(px(i), py(i + 1));
    ctx.closePath();
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, W * 0.02);
    ctx.strokeStyle = 'rgba(255,255,255,.88)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(px(0), py(1), W * 0.03, 0, 7); ctx.fillStyle = '#ef4444'; ctx.fill();
  }

  function kmOf(outline) {
    if (!outline || outline.length < 4) return 0;
    let d = 0; const n = outline.length;
    for (let i = 0; i < n; i += 2) {
      const j = (i + 2) % n;
      d += Math.hypot(outline[i] - outline[j], outline[i + 1] - outline[j + 1]);
    }
    return d / PER_METRE / 1000;
  }

  // Where a thing is pinned, as pills; and the one button for the list up.
  function pinPills(x, tab) {
    return (x.pinned_home ? ' <span class="pill gold">pinned on Home</span>' : '')
      + (x.pinned ? ` <span class="pill gold">pinned on ${tab}</span>` : '');
  }
  function pinButton(kind, id, x, where, tab) {
    const on = where === 'home' ? !!x.pinned_home : !!x.pinned;
    const label = where === 'home' ? 'Home' : tab;
    return `<button class="${on ? 'pinned' : ''}" data-kind="${kind}" data-t="${esc(id)}" data-where="${where}" data-pin="${on ? '0' : '1'}">${on ? 'Unpin from ' + label : 'Pin on ' + label}</button>`;
  }

  function trackCard(t, badge, where) {
    const km = kmOf(t.outline);
    return `<div class="fcard ${(where === 'home' ? t.pinned_home : t.pinned) ? 'ispinned' : ''}">
      <canvas class="map" data-key="${esc(t.key)}"></canvas>
      <div class="body">
        <div class="nm">${badge ? '<span class="pill gold">today</span>' : ''}${esc(t.name)}${pinPills(t, 'Tracks')}</div>
        <div class="by">by ${esc(t.author || 'Unknown Racer')}</div>
        <div class="meta"><span>${km.toFixed(1)} km</span><span>${t.laps} lap${t.laps === 1 ? '' : 's'}</span><span>${t.finishers ?? 0} racers</span></div>
        <div class="foot"><span class="thumbs">▲ ${t.ups ?? 0}&nbsp;&nbsp;▼ ${t.downs ?? 0}</span>
          ${pinButton('track', t.key, t, where, 'Tracks')}</div>
      </div></div>`;
  }

  // A TEAM'S BADGE, AS THE PHONES DRAW IT: eight by eight, one character a
  // pixel — '.' nothing, '1' the team's own colour, 2-8 the fixed paints
  // (team_logo.gd). Drawn as an SVG so a reviewer sees the pixels a player
  // drew before approving the cup (2026-09-21).
  const PAINTS = { 2: '#f5f5f0', 3: '#121217', 4: '#eab308', 5: '#ef4444', 6: '#3b82f6', 7: '#22c55e', 8: '#f97316' };
  function teamBadge(t) {
    const colour = /^[0-9a-f]{6}$/i.test(String(t.color || '')) ? '#' + t.color : '#888';
    const logo = typeof t.logo === 'string' && t.logo.length === 64 ? t.logo : '';
    let cells = '';
    for (let i = 0; i < logo.length; i++) {
      const ch = logo[i]; if (ch === '.') continue;
      const fill = ch === '1' ? colour : (PAINTS[ch] || 'transparent');
      cells += `<rect x="${i % 8}" y="${Math.floor(i / 8)}" width="1" height="1" fill="${fill}"/>`;
    }
    const svg = logo ? `<svg viewBox="0 0 8 8" shape-rendering="crispEdges">${cells}</svg>`
                     : `<span class="dot" style="background:${colour}"></span>`;
    return `<span class="team" title="${esc(t.name || '')}">${svg}${esc(t.name || '')}</span>`;
  }
  function teamRow(teams) {
    return Array.isArray(teams) && teams.length ? `<div class="teams">${teams.map(teamBadge).join('')}</div>` : '';
  }

  function cupCard(c, where) {
    const stages = Array.isArray(c.stages) ? c.stages.length : (c.stages || 0);
    return `<div class="fcard ${(where === 'home' ? c.pinned_home : c.pinned) ? 'ispinned' : ''}">
      <div class="cup"><div class="n">${stages}</div><div class="l">stage${stages === 1 ? '' : 's'}</div></div>
      <div class="body">
        <div class="nm">${esc(c.name)}${pinPills(c, 'Champs')}</div>
        <div class="by">by ${esc(c.author_name || 'Unknown Racer')}</div>
        <div class="meta"><span>${c.entrants ?? 0} entrants</span></div>
        ${teamRow(c.constructors)}
        <div class="foot"><span class="thumbs">▲ ${c.ups ?? 0}&nbsp;&nbsp;▼ ${c.downs ?? 0}</span>
          ${pinButton('cup', c.id, c, where, 'Champs')}</div>
      </div></div>`;
  }

  async function feed() {
    const sub = `<div class="subtabs">
      ${['home', 'tracks', 'cups'].map((k) => `<button data-sub="${k}" class="${feedSub === k ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}
      ${sortChips()}
    </div>`;
    const before = feedBefore;
    let cards = [], maps = [];
    if (feedSub === 'home') {
      // HOME on the phone: the cups and the tracks, one list, ordered by
      // HOME's own pins — a pin on TRACKS or CHAMPS moves nothing here.
      pinField = 'pinned_home';
      const [rows, cupRows] = await Promise.all([
        rpc('feed', { p_limit: 240, p_offset: 0, p_sort: feedSort }),
        rpc('cups', { p_limit: 240 }).catch(() => [])]);
      const all = [...rows.map((t) => ({ kind: 'track', row: t })), ...cupRows.map((c) => ({ kind: 'cup', row: c }))];
      all.sort((x, y) => before(x.row, y.row));
      for (const e of all) {
        if (e.kind === 'track') { cards.push(trackCard(e.row, false, 'home')); maps.push(e.row); }
        else cards.push(cupCard(e.row, 'home'));
      }
    } else if (feedSub === 'tracks') {
      pinField = 'pinned';
      const rows = await rpc('feed', { p_limit: 240, p_offset: 0, p_sort: feedSort });
      rows.sort(before);
      for (const t of rows) { cards.push(trackCard(t, false, 'tab')); maps.push(t); }
    } else {
      pinField = 'pinned';
      const rows = await rpc('cups', { p_limit: 240 });
      rows.sort(before);
      for (const c of rows) cards.push(cupCard(c, 'tab'));
    }

    const key = 'feed:' + feedSub;
    const grid = () => {
      const at = pageOf(key);
      const slice = cards.slice(at * CARDS, (at + 1) * CARDS);
      return `<div class="feedgrid">${slice.join('')}</div>${pagerBar(key, cards.length, CARDS)}`;
    };
    const paint = () => {
      for (const cv of main.querySelectorAll('canvas.map')) {
        const t = maps.find((m) => m.key === cv.dataset.key);
        if (t) requestAnimationFrame(() => drawMap(cv, t.outline));
      }
    };
    rerender[key] = () => {
      const wrap = main.querySelector(`[data-pagewrap="${key}"]`); if (wrap) { wrap.innerHTML = grid(); paint(); }
    };
    main.innerHTML = sub + (cards.length
      ? `<div data-pagewrap="${esc(key)}">${grid()}</div>`
      : `<div class="empty">Nothing here yet — what players see on this feed is empty.</div>`);
    paint();

    main.onclick = (e) => {
      const s = e.target.closest('button[data-sub]');
      if (s) { feedSub = s.dataset.sub; return feed(); }
      const so = e.target.closest('button[data-sort]');
      if (so) { feedSort = so.dataset.sort; return feed(); }
      const b = e.target.closest('button[data-kind]'); if (!b) return;
      const pin = b.dataset.pin === '1';
      const where = b.dataset.where || 'tab';
      if (b.dataset.kind === 'track') act('pin_track', { p_track: b.dataset.t, p_pinned: pin, p_reason: '', p_where: where }, pin ? 'Track pinned' : 'Track unpinned');
      else act('pin_cup', { p_cup: b.dataset.t, p_pinned: pin, p_reason: '', p_where: where }, pin ? 'Cup pinned' : 'Cup unpinned');
    };
  }

  boot();
})();
</script>
</body>
</html>
